name: Cockpit AI MVP CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Compile check
        run: python -m compileall -q app

      - name: API smoke check
        run: |
          python - <<'PY'
          import ast
          ast.parse(open("app/main.py").read())
          print("API source smoke check passed")
          PY
