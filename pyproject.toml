[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cockpit-ai-mvp"
version = "0.1.0"
description = "Development MVP for connecting cockpit R&D workflows with Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.6.0",
]

[project.scripts]
cockpit-ai = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]
